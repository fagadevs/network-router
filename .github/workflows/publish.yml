name: Publicar imagen Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de la imagen, por ejemplo 1.0.1"
        required: true
        default: "1.0.1"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fagadevs/network-router:${{ inputs.version }}
            ghcr.io/fagadevs/network-router:latest
